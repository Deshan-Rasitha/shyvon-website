<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#F6D989" />
      <stop offset="70%" stop-color="#D9AD45" />
      <stop offset="100%" stop-color="#9E7B28" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Teacup with botanical steam icon -->
  <g transform="translate(180, 5)">
    <!-- Steam / Botanical leaves -->
    <path d="M12,18 C10,12 18,7 20,2 C22,7 30,12 28,18 C26,14 24,11 20,9 C16,11 14,14 12,18 Z" fill="url(#goldGrad)" />
    <path d="M20,18 C23,12 32,10 35,5 C35,11 29,15 25,18 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Teacup bowl -->
    <path d="M5,22 C5,32 14,37 20,37 C26,37 35,32 35,22 Z" fill="url(#goldGrad)" />
    <!-- Teacup saucer base -->
    <path d="M2,39 C10,38 30,38 38,39 C36,41 24,41.5 20,41.5 C16,41.5 4,41 2,39 Z" fill="url(#goldGrad)" />
  </g>

  <!-- SHYVON Brand Name -->
  <text x="200" y="80" 
        font-family="'Cinzel', 'Playfair Display', 'Times New Roman', Georgia, serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)">
    SHYVON
  </text>

  <!-- Decorative Ornate Flourish Lines -->
  <path d="M60,90 L130,90" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="134" cy="90" r="2" fill="url(#goldGrad)" />
  <text x="200" y="93" 
        font-family="'Inter', sans-serif" 
        font-size="10" 
        font-weight="600" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="#F6D989">
    NATURAL FOODS
  </text>
  <circle cx="266" cy="90" r="2" fill="url(#goldGrad)" />
  <path d="M270,90 L340,90" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Tagline -->
  <text x="200" y="108" 
        font-family="'Playfair Display', Georgia, serif" 
        font-style="italic" 
        font-size="11" 
        letter-spacing="2.5" 
        text-anchor="middle" 
        fill="#B9B9B9">
    Pure • Healthy • Delicious
  </text>
</svg>
